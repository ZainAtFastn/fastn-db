:root{--bg:#f7f7f5;--surface:#fff;--ink:#1d1d1b;--ink-2:#55544f;--line:#e2e0da;--accent:#2f5bd3;--red:#c2362f}

h1{font-size:20px;margin:0 0 6px}p{color:var(--ink-2);font-size:14px;margin:0 0 18px}
input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:16px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{margin-top:12px;width:100%;padding:10px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;cursor:pointer}
.err{color:var(--red);font-size:14px;margin-top:10px;min-height:20px}
